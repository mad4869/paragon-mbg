[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.13.0"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client", "@resvg/resvg-js"]
  included_files = ["assets/fonts/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
